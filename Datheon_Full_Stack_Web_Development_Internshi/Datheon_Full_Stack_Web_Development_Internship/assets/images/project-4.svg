<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none">
  <defs>
    <linearGradient id="p4bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#27272A"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" rx="12" fill="url(#p4bg)"/>

  <!-- Window Chrome -->
  <rect x="0" y="0" width="600" height="38" rx="12" fill="#27272A"/>
  <rect x="0" y="24" width="600" height="14" fill="#27272A"/>
  <circle cx="24" cy="19" r="6" fill="#EF4444"/>
  <circle cx="44" cy="19" r="6" fill="#F59E0B"/>
  <circle cx="64" cy="19" r="6" fill="#10B981"/>
  <rect x="96" y="9" width="340" height="20" rx="6" fill="#18181B"/>
  <text x="110" y="23" fill="#A1A1AA" font-family="system-ui" font-size="11">https://omnichat.dev/workspace/gemini-live</text>

  <!-- Split View UI -->
  <!-- Left Panel: Chat thread -->
  <g transform="translate(20, 52)">
    <!-- User Bubble -->
    <g transform="translate(140, 10)">
      <rect width="200" height="38" rx="12" fill="#3F3F46"/>
      <text x="14" y="23" fill="#F4F4F5" font-family="system-ui" font-size="11">Refactor async queue handler in Go</text>
    </g>

    <!-- AI Response Bubble -->
    <g transform="translate(10, 58)">
      <circle cx="16" cy="16" r="16" fill="url(#aiGrad)"/>
      <text x="16" y="21" fill="#FFFFFF" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">✦</text>

      <rect x="42" y="0" width="300" height="110" rx="12" fill="#27272A" stroke="#52525B" stroke-width="1"/>
      <text x="56" y="24" fill="#C084FC" font-family="system-ui" font-weight="bold" font-size="11">Gemini 1.5 Flash • Streaming (42ms)</text>
      
      <!-- Code snippet box inside chat -->
      <rect x="54" y="34" width="276" height="64" rx="6" fill="#18181B"/>
      <text x="64" y="52" fill="#A78BFA" font-family="monospace" font-size="10">func (q *Queue) Process(ctx context.Context) {</text>
      <text x="76" y="68" fill="#38BDF8" font-family="monospace" font-size="10">  select { case msg := &lt;-q.ch: ...</text>
      <text x="64" y="84" fill="#A78BFA" font-family="monospace" font-size="10">}</text>
    </g>

    <!-- Typing / Chat Input Box -->
    <g transform="translate(10, 190)">
      <rect width="332" height="42" rx="10" fill="#27272A" stroke="#6366F1" stroke-width="1.5"/>
      <text x="16" y="25" fill="#71717A" font-family="system-ui" font-size="11">Ask Gemini or execute command... (/)</text>
      <rect x="294" y="7" width="28" height="28" rx="6" fill="#6366F1"/>
      <path d="M304 21 L308 17 L312 21 M308 17 L308 26" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Right Panel: Live Code Execution & Visual Workspace -->
  <g transform="translate(385, 52)">
    <rect width="195" height="285" rx="10" fill="#18181B" stroke="#3F3F46" stroke-width="1"/>
    
    <!-- Code Editor Tabs -->
    <rect x="0" y="0" width="195" height="32" rx="10" fill="#27272A"/>
    <rect x="0" y="20" width="195" height="12" fill="#27272A"/>
    <text x="14" y="20" fill="#E4E4E7" font-family="monospace" font-size="11">worker.go</text>
    <circle cx="85" cy="16" r="3" fill="#10B981"/>

    <!-- Code Lines -->
    <text x="14" y="56" fill="#64748B" font-family="monospace" font-size="10">01</text>
    <text x="36" y="56" fill="#F43F5E" font-family="monospace" font-size="10">package</text>
    <text x="84" y="56" fill="#F4F4F5" font-family="monospace" font-size="10">main</text>

    <text x="14" y="76" fill="#64748B" font-family="monospace" font-size="10">02</text>
    <text x="36" y="76" fill="#F43F5E" font-family="monospace" font-size="10">import</text>
    <text x="78" y="76" fill="#FBBF24" font-family="monospace" font-size="10">"sync"</text>

    <text x="14" y="96" fill="#64748B" font-family="monospace" font-size="10">03</text>
    <text x="36" y="96" fill="#A855F7" font-family="monospace" font-size="10">type</text>
    <text x="66" y="96" fill="#38BDF8" font-family="monospace" font-size="10">Pool</text>
    <text x="96" y="96" fill="#A855F7" font-family="monospace" font-size="10">struct</text>

    <!-- Terminal Output -->
    <g transform="translate(10, 160)">
      <rect width="175" height="110" rx="6" fill="#09090B" stroke="#27272A"/>
      <text x="10" y="20" fill="#10B981" font-family="monospace" font-size="9">$ go test -bench=.</text>
      <text x="10" y="38" fill="#A1A1AA" font-family="monospace" font-size="9">BenchmarkPool-8</text>
      <text x="10" y="56" fill="#E4E4E7" font-family="monospace" font-size="9">  4,291,010 ops/s</text>
      <text x="10" y="74" fill="#38BDF8" font-family="monospace" font-size="9">  32.4 ns/op</text>
      <text x="10" y="94" fill="#34D399" font-family="monospace" font-size="9">PASS (0.04s)</text>
    </g>
  </g>
</svg>
