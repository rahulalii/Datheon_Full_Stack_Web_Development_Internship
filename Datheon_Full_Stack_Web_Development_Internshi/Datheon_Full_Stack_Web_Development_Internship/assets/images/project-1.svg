<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none">
  <defs>
    <linearGradient id="p1bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="p1chart" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="p1area" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" rx="12" fill="url(#p1bg)"/>

  <!-- Browser Window Chrome -->
  <rect x="0" y="0" width="600" height="38" rx="12" fill="#1E293B"/>
  <rect x="0" y="24" width="600" height="14" fill="#1E293B"/>
  <circle cx="24" cy="19" r="6" fill="#EF4444"/>
  <circle cx="44" cy="19" r="6" fill="#F59E0B"/>
  <circle cx="64" cy="19" r="6" fill="#10B981"/>
  <rect x="96" y="9" width="340" height="20" rx="6" fill="#0F172A"/>
  <text x="110" y="23" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">https://devpulse.ai/analytics/dashboard</text>

  <!-- Left Sidebar -->
  <rect x="0" y="38" width="80" height="322" fill="#090D16" opacity="0.6"/>
  <rect x="18" y="55" width="44" height="8" rx="4" fill="#6366F1"/>
  <rect x="18" y="75" width="34" height="6" rx="3" fill="#334155"/>
  <rect x="18" y="95" width="40" height="6" rx="3" fill="#334155"/>
  <rect x="18" y="115" width="28" height="6" rx="3" fill="#334155"/>
  <rect x="18" y="135" width="36" height="6" rx="3" fill="#334155"/>

  <!-- Main Dashboard Content -->
  <!-- Top Stat Cards -->
  <g transform="translate(100, 52)">
    <rect width="140" height="64" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="14" y="22" fill="#94A3B8" font-family="system-ui" font-size="11">Velocity Score</text>
    <text x="14" y="48" fill="#F8FAFC" font-family="system-ui" font-weight="bold" font-size="20">98.4%</text>
    <path d="M100 44 L112 32 L124 38 L130 26" stroke="#10B981" stroke-width="2" fill="none"/>
  </g>

  <g transform="translate(255, 52)">
    <rect width="140" height="64" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="14" y="22" fill="#94A3B8" font-family="system-ui" font-size="11">Code Coverage</text>
    <text x="14" y="48" fill="#F8FAFC" font-family="system-ui" font-weight="bold" font-size="20">94.2%</text>
    <path d="M100 38 L110 32 L120 40 L130 28" stroke="#6366F1" stroke-width="2" fill="none"/>
  </g>

  <g transform="translate(410, 52)">
    <rect width="165" height="64" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="14" y="22" fill="#94A3B8" font-family="system-ui" font-size="11">AI Review Latency</text>
    <text x="14" y="48" fill="#38BDF8" font-family="system-ui" font-weight="bold" font-size="20">180ms</text>
    <rect x="110" y="34" width="40" height="18" rx="9" fill="#0284C7" fill-opacity="0.2"/>
    <text x="130" y="47" fill="#38BDF8" font-family="system-ui" font-size="10" text-anchor="middle">Fast</text>
  </g>

  <!-- Main Chart Section -->
  <g transform="translate(100, 130)">
    <rect width="475" height="205" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="18" y="26" fill="#F1F5F9" font-family="system-ui" font-weight="bold" font-size="13">Deployment Frequency &amp; Quality Trends</text>

    <!-- Grid lines -->
    <line x1="20" y1="60" x2="455" y2="60" stroke="#334155" stroke-dasharray="3 3"/>
    <line x1="20" y1="105" x2="455" y2="105" stroke="#334155" stroke-dasharray="3 3"/>
    <line x1="20" y1="150" x2="455" y2="150" stroke="#334155" stroke-dasharray="3 3"/>

    <!-- Area & Line chart -->
    <path d="M25 140 C 70 120, 120 145, 170 95 C 220 50, 270 110, 330 65 C 380 40, 420 70, 450 35 L 450 175 L 25 175 Z" fill="url(#p1area)"/>
    <path d="M25 140 C 70 120, 120 145, 170 95 C 220 50, 270 110, 330 65 C 380 40, 420 70, 450 35" stroke="url(#p1chart)" stroke-width="3.5" fill="none"/>

    <!-- Data Points -->
    <circle cx="170" cy="95" r="5" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="330" cy="65" r="5" fill="#EC4899" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="450" cy="35" r="5" fill="#6366F1" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Floating Badge -->
    <g transform="translate(305, 20)">
      <rect width="80" height="24" rx="6" fill="#0F172A" stroke="#8B5CF6"/>
      <text x="40" y="16" fill="#C084FC" font-family="system-ui" font-size="10" font-weight="bold" text-anchor="middle">+42% Sprint</text>
    </g>
  </g>
</svg>
