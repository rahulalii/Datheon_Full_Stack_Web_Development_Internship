<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="avatarShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#6366F1" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Glowing outer circle -->
  <circle cx="160" cy="160" r="148" fill="url(#avatarBg)"/>
  <circle cx="160" cy="160" r="146" stroke="url(#ringGrad)" stroke-width="4" filter="url(#avatarShadow)"/>

  <!-- Background code matrix grid pattern -->
  <g opacity="0.15">
    <circle cx="90" cy="80" r="3" fill="#38BDF8"/>
    <circle cx="230" cy="90" r="3" fill="#EC4899"/>
    <circle cx="70" cy="220" r="3" fill="#818CF8"/>
    <circle cx="250" cy="210" r="3" fill="#34D399"/>
    <path d="M50 140 H100 M220 140 H270 M80 180 H120 M200 180 H240" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- Developer Silhouette / Character -->
  <!-- Shoulders & Hoodie -->
  <path d="M70 290 C70 230, 100 215, 140 210 L180 210 C220 215, 250 230, 250 290 Z" fill="url(#hoodieGrad)"/>
  <path d="M125 210 L160 250 L195 210" fill="#475569" opacity="0.6"/>
  <path d="M142 225 L142 270 M178 225 L178 270" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>

  <!-- Neck -->
  <rect x="145" y="175" width="30" height="35" rx="6" fill="#FBBF24"/>

  <!-- Head -->
  <ellipse cx="160" cy="140" rx="46" ry="52" fill="url(#faceGrad)"/>

  <!-- Hair / Beanie -->
  <path d="M114 135 C114 90, 130 75, 160 75 C190 75, 206 90, 206 135 C195 125, 185 120, 160 120 C135 120, 125 125, 114 135 Z" fill="#0F172A"/>

  <!-- Modern Tech Eyewear -->
  <rect x="126" y="128" width="28" height="18" rx="6" fill="#0F172A"/>
  <rect x="166" y="128" width="28" height="18" rx="6" fill="#0F172A"/>
  <rect x="128" y="130" width="24" height="14" rx="4" fill="url(#glassGrad)"/>
  <rect x="168" y="130" width="24" height="14" rx="4" fill="url(#glassGrad)"/>
  <line x1="154" y1="137" x2="166" y2="137" stroke="#0F172A" stroke-width="3"/>
  <line x1="116" y1="137" x2="126" y2="137" stroke="#0F172A" stroke-width="3"/>
  <line x1="194" y1="137" x2="204" y2="137" stroke="#0F172A" stroke-width="3"/>

  <!-- Friendly Smile & Nose -->
  <path d="M157 154 L160 157 L163 154" stroke="#D97706" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M150 168 Q160 176 170 168" stroke="#78350F" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Ambient Floating Tech Badges -->
  <g transform="translate(42, 60)">
    <rect width="44" height="28" rx="8" fill="#1E293B" stroke="#6366F1" stroke-width="1.5"/>
    <text x="22" y="18" fill="#818CF8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">&lt;/&gt;</text>
  </g>
  <g transform="translate(235, 75)">
    <rect width="42" height="28" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
    <text x="21" y="18" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">TS</text>
  </g>
  <g transform="translate(240, 210)">
    <rect width="42" height="28" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="21" y="18" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">API</text>
  </g>
</svg>
