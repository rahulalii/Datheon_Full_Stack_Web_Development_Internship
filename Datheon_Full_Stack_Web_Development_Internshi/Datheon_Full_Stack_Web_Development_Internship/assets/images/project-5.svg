<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none">
  <defs>
    <linearGradient id="p5bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>
    <linearGradient id="p5glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" rx="12" fill="url(#p5bg)"/>

  <!-- Chrome -->
  <rect x="0" y="0" width="600" height="38" rx="12" fill="#1F2937"/>
  <rect x="0" y="24" width="600" height="14" fill="#1F2937"/>
  <circle cx="24" cy="19" r="6" fill="#EF4444"/>
  <circle cx="44" cy="19" r="6" fill="#F59E0B"/>
  <circle cx="64" cy="19" r="6" fill="#10B981"/>
  <rect x="96" y="9" width="340" height="20" rx="6" fill="#111827"/>
  <text x="110" y="23" fill="#9CA3AF" font-family="system-ui" font-size="11">https://algoviz.app/graphs/dijkstra-a-star</text>

  <!-- Controls bar -->
  <g transform="translate(25, 48)">
    <rect width="550" height="34" rx="6" fill="#1F2937" stroke="#374151" stroke-width="1"/>
    <!-- Play button -->
    <rect x="10" y="5" width="24" height="24" rx="4" fill="#10B981"/>
    <polygon points="19,12 19,22 27,17" fill="#FFFFFF"/>
    
    <text x="46" y="22" fill="#F3F4F6" font-family="system-ui" font-size="11" font-weight="bold">Algorithm: A* Pathfinding</text>
    <text x="230" y="22" fill="#9CA3AF" font-family="system-ui" font-size="11">Heuristic: Manhattan</text>
    <text x="370" y="22" fill="#F59E0B" font-family="system-ui" font-size="11">Visited: 48 nodes</text>
    <rect x="470" y="7" width="70" height="20" rx="4" fill="#374151"/>
    <text x="505" y="21" fill="#F3F4F6" font-family="system-ui" font-size="10" text-anchor="middle">Step: 12ms</text>
  </g>

  <!-- Canvas Visualizer with Graph Nodes -->
  <g transform="translate(25, 94)">
    <rect width="550" height="240" rx="8" fill="#030712" stroke="#1F2937" stroke-width="1"/>

    <!-- Grid Dots Background -->
    <pattern id="gridDots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#374151" opacity="0.6"/>
    </pattern>
    <rect width="550" height="240" rx="8" fill="url(#gridDots)"/>

    <!-- Graph Edges -->
    <!-- Non-path edges -->
    <line x1="80" y1="120" x2="160" y2="60" stroke="#374151" stroke-width="2"/>
    <line x1="80" y1="120" x2="160" y2="180" stroke="#374151" stroke-width="2"/>
    <line x1="160" y1="60" x2="270" y2="50" stroke="#374151" stroke-width="2"/>
    <line x1="160" y1="180" x2="260" y2="190" stroke="#374151" stroke-width="2"/>
    <line x1="270" y1="50" x2="380" y2="70" stroke="#374151" stroke-width="2"/>
    <line x1="260" y1="190" x2="360" y2="170" stroke="#374151" stroke-width="2"/>
    <line x1="380" y1="70" x2="480" y2="120" stroke="#374151" stroke-width="2"/>
    <line x1="360" y1="170" x2="480" y2="120" stroke="#374151" stroke-width="2"/>

    <!-- Active Optimal Shortest Path Edges (Glowing) -->
    <path d="M80 120 L180 120 L270 120 L370 120 L480 120" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
    <path d="M80 120 L180 120 L270 120 L370 120 L480 120" stroke="#FCD34D" stroke-width="2" stroke-linecap="round"/>

    <!-- Nodes -->
    <!-- Start Node -->
    <circle cx="80" cy="120" r="18" fill="#10B981" stroke="#34D399" stroke-width="3"/>
    <text x="80" y="125" fill="#FFFFFF" font-family="system-ui" font-weight="bold" font-size="11" text-anchor="middle">S</text>

    <!-- Mid Nodes on path -->
    <circle cx="180" cy="120" r="15" fill="#D97706" stroke="#FBBF24" stroke-width="3"/>
    <text x="180" y="124" fill="#FFFFFF" font-family="system-ui" font-size="10" text-anchor="middle">N1</text>

    <circle cx="270" cy="120" r="15" fill="#D97706" stroke="#FBBF24" stroke-width="3"/>
    <text x="270" y="124" fill="#FFFFFF" font-family="system-ui" font-size="10" text-anchor="middle">N2</text>

    <circle cx="370" cy="120" r="15" fill="#D97706" stroke="#FBBF24" stroke-width="3"/>
    <text x="370" y="124" fill="#FFFFFF" font-family="system-ui" font-size="10" text-anchor="middle">N3</text>

    <!-- Target Node -->
    <circle cx="480" cy="120" r="18" fill="#EF4444" stroke="#F87171" stroke-width="3"/>
    <text x="480" y="125" fill="#FFFFFF" font-family="system-ui" font-weight="bold" font-size="11" text-anchor="middle">E</text>

    <!-- Peripheral Visited Nodes -->
    <circle cx="160" cy="60" r="12" fill="#1F2937" stroke="#60A5FA" stroke-width="2"/>
    <circle cx="160" cy="180" r="12" fill="#1F2937" stroke="#60A5FA" stroke-width="2"/>
    <circle cx="270" cy="50" r="12" fill="#1F2937" stroke="#60A5FA" stroke-width="2"/>
    <circle cx="260" cy="190" r="12" fill="#1F2937" stroke="#60A5FA" stroke-width="2"/>
    <circle cx="380" cy="70" r="12" fill="#1F2937" stroke="#60A5FA" stroke-width="2"/>
    <circle cx="360" cy="170" r="12" fill="#1F2937" stroke="#60A5FA" stroke-width="2"/>

    <!-- Floating Metric Card -->
    <g transform="translate(180, 180)">
      <rect width="190" height="42" rx="6" fill="#111827" stroke="#374151" stroke-width="1"/>
      <text x="12" y="18" fill="#9CA3AF" font-family="system-ui" font-size="9">Time Complexity: O(E + V log V)</text>
      <text x="12" y="32" fill="#10B981" font-family="system-ui" font-size="9" font-weight="bold">Optimal Path Cost: 42 units</text>
    </g>
  </g>
</svg>
