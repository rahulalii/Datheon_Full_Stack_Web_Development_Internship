<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none">
  <defs>
    <linearGradient id="p6bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18020C"/>
      <stop offset="100%" stop-color="#310D20"/>
    </linearGradient>
    <linearGradient id="p6accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" rx="12" fill="url(#p6bg)"/>

  <!-- Chrome -->
  <rect x="0" y="0" width="600" height="38" rx="12" fill="#2E0A1E"/>
  <rect x="0" y="24" width="600" height="14" fill="#2E0A1E"/>
  <circle cx="24" cy="19" r="6" fill="#EF4444"/>
  <circle cx="44" cy="19" r="6" fill="#F59E0B"/>
  <circle cx="64" cy="19" r="6" fill="#10B981"/>
  <rect x="96" y="9" width="340" height="20" rx="6" fill="#18020C"/>
  <text x="110" y="23" fill="#FDA4AF" font-family="system-ui" font-size="11">https://nexus-store.vercel.app/shop/checkout</text>

  <!-- Store Header & Showcase -->
  <g transform="translate(30, 52)">
